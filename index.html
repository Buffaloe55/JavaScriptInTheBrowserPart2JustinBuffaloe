<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>CS208 - To-Do List</title>
  <meta name="description" content="A simple to-do list webpage where users can add and remove tasks using JavaScript">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <h1>To-Do List</h1>
  <button id="theme-btn">🌙 Dark Mode</button>

  <!-- Input for adding new tasks -->
  <label for="new-task">New task:</label>
  <input type="text" id="new-task" placeholder="Add Tasks">
  <button id="add-btn">Add</button>

  <!-- Ordered list of tasks -->
  <ol id="task-list">
    <li>
      <span class="task-text">Clean bathroom</span>
      <button class="done-btn">&#10006;</button>
    </li>
    <li>
      <span class="task-text">Study for big exam</span>
      <button class="done-btn">&#10006;</button>
    </li>
    <li>
      <span class="task-text">Feed fish</span>
      <button class="done-btn">&#10006;</button>
    </li>
  </ol>

   <!-- Display the number of remaining tasks -->
  <p id="task-count">0 Tasks Remaining</p>

  <footer>
    <p>
        AI Assistance: OpenAI ChatGPT (GPT-6), October 31, 2026.
        Used for HTML, CSS, JavaScript development, debugging,
        and additional features.
        <a href="https://chatgpt.com/">OpenAI ChatGPT</a>
    </p>
</footer>

</body>
</html>
